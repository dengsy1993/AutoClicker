name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build AutoClicker.exe
        shell: cmd
        run: |
          "%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /platform:anycpu /optimize+ /codepage:65001 /utf8output /win32icon:assets\app.ico /win32manifest:app.manifest /out:AutoClicker.exe /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll src\*.cs

      - name: Self test
        shell: cmd
        run: AutoClicker.exe --selftest

      - uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-windows
          path: AutoClicker.exe

  macos:
    name: macOS (.app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swiftc --version

      - name: Build
        run: |
          chmod +x macos/build.sh
          ./macos/build.sh

      - name: Package
        run: |
          cd macos
          ditto -c -k --sequesterRsrc --keepParent build/AutoClicker.app AutoClicker-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-macos
          path: macos/AutoClicker-macOS.zip
